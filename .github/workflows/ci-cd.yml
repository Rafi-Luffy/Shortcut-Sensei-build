name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Run backend tests
      run: cd backend && npm test --if-present

    - name: Run frontend tests
      run: npm test -- --watchAll=false --if-present

    - name: Build frontend
      run: npm run build

    - name: Check linting
      run: npm run lint --if-present

  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci && cd backend && npm ci && cd ..

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Run backend security audit
      run: cd backend && npm audit --audit-level moderate

  deploy:
    needs: [test, security-audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install backend dependencies
      run: cd backend && npm ci && cd ..

    - name: Build application
      run: npm run build

    - name: Run tests
      run: npm test -- --watchAll=false --if-present

    # Deploy step removed - configure deployment separately if needed
    # Notification step removed - configure notifications separately if needed